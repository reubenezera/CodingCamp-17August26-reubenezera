<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header>
    <div class="header-content">
      <h1>Expense &amp; Budget Visualizer</h1>
      <button id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
        <span aria-hidden="true">◐</span> Dark mode
      </button>
    </div>
    <div id="balance-display">Total Expenditure: $0.00</div>
  </header>

  <main class="app-grid">

    <!-- Left column: Input Form -->
    <section class="form-section">
      <h2>Add Expense</h2>
      <form id="expense-form" novalidate>

        <div class="field-group">
          <label for="item-name">Item Name</label>
          <input
            id="item-name"
            type="text"
            maxlength="100"
            placeholder="e.g. Lunch"
            autocomplete="off"
          />
          <span class="field-error" id="item-name-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="amount">Amount</label>
          <input
            id="amount"
            type="number"
            step="0.01"
            min="0.01"
            placeholder="e.g. 12500"
          />
          <span class="field-error" id="amount-error" role="alert" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="field-error" id="category-error" role="alert" aria-live="polite"></span>
        </div>

        <button type="submit">Add Expense</button>

        <div id="storage-error" class="storage-error hidden" role="alert" aria-live="assertive"></div>

      </form>
    </section>

    <!-- Right column: Transaction List -->
    <section class="list-section">
      <h2>Transactions</h2>
      <div id="transaction-list" aria-label="Transaction list">
        <!-- populated by renderTransactionList() -->
      </div>
    </section>

  </main>

  <!-- Custom Category Manager -->
  <section class="category-manager-section">
    <h2>Manage Categories</h2>
    <div class="category-manager-inner">
      <div class="add-category-row">
        <input
          id="new-category-input"
          type="text"
          maxlength="50"
          placeholder="New category name…"
          autocomplete="off"
          aria-label="New category name"
        />
        <button id="add-category-btn" type="button">+ Add</button>
      </div>
      <span class="field-error" id="new-category-error" role="alert" aria-live="polite"></span>
      <div id="custom-category-list" aria-label="Category list">
        <!-- populated by renderCategoryManager() -->
      </div>
    </div>
  </section>

  <!-- Chart Section -->
  <section class="chart-section">
    <h2>Spending by Category</h2>
    <div id="chart-container">
      <canvas id="expense-chart" aria-label="Expense pie chart" role="img"></canvas>
      <div id="chart-placeholder" class="hidden">No data to visualize.</div>
    </div>
  </section>

  <!-- Monthly Summary Section -->
  <section class="monthly-summary-section">
    <h2>Monthly Summary</h2>
    <div id="monthly-summary-content" aria-label="Monthly expense summary">
      <!-- populated by renderMonthlySummary() -->
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
